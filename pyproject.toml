[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv-stats"
version = "0.4.2"
description = "A Python package for the life sciences to conduct hypothesis testing from CSV files."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mitchell Tillman", email = "mtillman14@gmail.com"},
]
maintainers = [
    {name = "Mitchell Tillman", email = "mtillman14@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
# The core (csvstats.descriptive) needs only these, so a plotting package can
# depend on csv-stats cheaply. The hypothesis tests (ttest, anova) and the PDF
# report need the "full" extra: pip install "csv-stats[full]".
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.7",
]

[project.optional-dependencies]
full = [
    "pingouin>=0.6.0",
    "statsmodels>=0.14.5",
    "patsy>=0.5",  # csvstats.lmm builds its design matrices with patsy
    "reportlab>=4.4.4",
    "matplotlib>=3.6",
    "seaborn>=0.13",
]
dev = [
    "csv-stats[full]",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/mtillman14/csv-stats"
Documentation = "https://github.com/mtillman14/csv-stats"
Repository = "https://github.com/mtillman14/csv-stats"
Issues = "https://github.com/mtillman14/csv-stats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/csvstats"]

# The sdist keeps the src/ layout: the wheel is built FROM the sdist, and
# looks for src/csvstats. `packages` here re-rooted it to csvstats/, so the
# 0.2.0 wheel came out empty (metadata only).
[tool.hatch.build.targets.sdist]
only-include = ["src/csvstats", "tests", "README.md"]

[tool.hatch.build]
ignore-vcs = true

# Collect only tests/. A bare `pytest` also walked src/, where the library
# module utils/test_assumptions.py (functions named test_*) was collected as
# tests and errored for missing fixtures.
[tool.pytest.ini_options]
testpaths = ["tests"]